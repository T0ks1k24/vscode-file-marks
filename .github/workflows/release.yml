name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read the version and look for its tag
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        if: steps.version.outputs.release == 'true'
        run: npm run check

      - name: Build the .vsix
        if: steps.version.outputs.release == 'true'
        run: npm run package

      - name: Take the release notes from the changelog
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See the [changelog](CHANGELOG.md)." > release-notes.md
          fi
          cat release-notes.md

      - name: Publish to the VS Code Marketplace
        if: steps.version.outputs.release == 'true' && env.VSCE_PAT != ''
        run: npm run publish:marketplace

      # Open VSX is a bonus, so a failure here does not hold back the tag and
      # the GitHub release. The namespace has to exist before the first publish
      # and creating it again is an error, hence the `|| true`.
      - name: Publish to Open VSX
        if: steps.version.outputs.release == 'true' && env.OVSX_PAT != ''
        continue-on-error: true
        run: |
          npx ovsx create-namespace "$(node -p "require('./package.json').publisher")" || true
          npm run publish:openvsx

      - name: Tag the commit
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            file-marks-explorer.vsix \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            echo "Released v${{ steps.version.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: v${{ steps.version.outputs.version }} is already tagged. Bump \`version\` in package.json to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
