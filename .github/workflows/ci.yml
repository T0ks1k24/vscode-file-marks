name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Syntax check and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Build the .vsix
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: file-marks-vsix
          path: file-marks.vsix
          if-no-files-found: error
