name: Idea
description: Something the extension should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The workflow, not the feature — it often turns out a setting already covers it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
